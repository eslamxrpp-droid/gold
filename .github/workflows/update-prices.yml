# Rebuilds the site with fresh prices and uploads it to Cloudflare Pages.
# If the price fails a safety check, build.py exits with an error, the upload step is skipped,
# and the pages already online stay as they are.
name: Update prices

on:
  schedule:
    # REQUEST BUDGET. Metals.Dev meters per request and the plan is 10,000/month ($9.99 Silver).
    # Each build spends 2 requests (/v1/latest + gold bid/ask), plus at most 1 backfill call
    # on a build that finds a gap in the daily history (bounded: see history.py).
    #   every  5 min = 8,760 builds = 17,550 requests  -> over budget
    #   every 10 min = 4,380 builds =  8,790 requests  -> only 12% spare, no room for re-runs
    #   every 15 min = 2,920 builds =  5,870 requests  -> 41% spare  <-- chosen
    # GitHub's scheduler is late by 5-30 min at busy hours anyway, so 5 vs 15 changes little in practice.
    - cron: "*/15 * * * *"
  workflow_dispatch:               # lets you run it by hand from the Actions tab
  push:
    branches: [main]

concurrency:
  group: update-prices
  cancel-in-progress: false        # queue, never overlap: two jobs committing history would race

permissions:
  contents: write        # to commit the daily price history
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        id: build
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
        run: python build.py --provider metals_dev

      - name: Run tests
        # The tests build into a temporary folder, never into dist/. On 2026-09-12 a test
        # rebuilt dist/ with sample data between this step and the upload, and the live site
        # briefly served sample prices. tests/test_prices.py::ProductionArtifact guards it.
        run: python -m unittest discover tests

      - name: Abort the deploy if main moved under us
        id: guard
        # dist/ was built and tested from the commit this job checked out. If main has moved
        # since - someone uploaded a fix, or another run pushed - then deploying now would
        # publish the OLDER code over the newer, and the source that gets pushed a step later
        # would no longer match what is live. There is always a next run in fifteen minutes,
        # so the safe move is to skip this one and say so.
        run: |
          git fetch --quiet origin main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse origin/main)
          if [ "$local_sha" = "$remote_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main moved from $local_sha to $remote_sha during this run."
            echo "::warning::Skipping the upload so the newer code is not overwritten. The next run publishes it."
          fi

      - name: Upload to Cloudflare Pages
        if: steps.guard.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the price history and the retry state
        # `always()` matters here. This step comes after the upload, so without it a failed
        # or skipped upload would also throw away the retry counters the build just wrote -
        # and the three-attempt backfill cap would quietly stop being durable in exactly the
        # situation it exists for. The rows and the counters are real whether or not the
        # deploy happened.
        #
        # It still commits nothing when the BUILD failed: build.py writes these outputs only
        # after validation passes, so `history_changed` is empty and the condition is false.
        # A build that produced no publishable artifact leaves no trail.
        #
        # `history_changed` is true when data/history.json changed OR when the bounded-retry
        # counters in data/history_state.json changed. Reporting only on history.json meant a
        # build whose backfill failed updated the counter on the runner and then threw the
        # runner away, so the three-attempt cap never advanced across fresh checkouts.
        #
        # `git add -A data` rather than naming the files: history_state.json does not exist
        # until the first gap appears, and naming a missing path fails the step.
        if: always() && steps.build.outputs.history_changed == 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "price history $(date -u +%F)"
          # Another run may have pushed between our checkout and now. Rebase rather than
          # force: the other run's history rows are as real as ours.
          git pull --rebase --autostash origin main
          git push
