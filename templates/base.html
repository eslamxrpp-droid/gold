<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#15120c">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{og_url}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{og_description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="stylesheet" href="{{css_url}}">
{{structured_data}}
</head>
<body data-page="{{page_key}}" data-locale="{{page_locale}}" data-snapshot="{{snapshot_url}}">
{{sample_banner}}
{{price_notices}}
<a class="skip" href="#main">تخطَّ إلى المحتوى / Skip to content</a>
<header class="site">
  <div class="bar">
    <a class="brand" href="{{home}}">{{site_name}}</a>
    {{lang_switch}}
  </div>
  <nav class="primary" aria-label="Sections">{{nav}}</nav>
</header>
<main id="main">
{{content}}
</main>
{{footer}}
{{page_script}}
</body>
</html>
